<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Sanitized Moodle attempt review fixture</title></head>
<body id="page-mod-quiz-review">
  <!-- Sanitized fixture based on the user's saved Moodle review page. -->
  <div id="question-10001-1" class="que multichoice deferredfeedback complete">
    <div class="info"><div class="state">Завершено</div><div class="grade">Балів 5,00 з 5,00</div></div>
    <div class="content">
      <div class="qtext">Демо-питання з одним правильним варіантом:</div>
      <div class="answer">
        <div class="r0"><input type="radio" disabled="disabled" aria-labelledby="q1a0"><div id="q1a0" data-region="answer-label">Варіант один</div></div>
        <div class="r1"><input type="radio" disabled="disabled" checked="checked" aria-labelledby="q1a1"><div id="q1a1" data-region="answer-label">Варіант два</div></div>
      </div>
    </div>
  </div>
  <div id="question-10001-2" class="que multichoice deferredfeedback complete">
    <div class="info"><div class="state">Завершено</div><div class="grade">Балів 0,50 з 1,50</div></div>
    <div class="content">
      <div class="qtext">Демо-питання з кількома вибраними варіантами:</div>
      <div class="answer">
        <div class="r0"><input type="checkbox" disabled="disabled" checked="checked" aria-labelledby="q2a0"><div id="q2a0" data-region="answer-label">Обраний варіант</div></div>
        <div class="r1"><input type="checkbox" disabled="disabled" aria-labelledby="q2a1"><div id="q2a1" data-region="answer-label">Інший варіант</div></div>
      </div>
    </div>
  </div>
</body>
</html>
